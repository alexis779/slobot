[project]
name = "slobot"
version = "0.1.18"
requires-python = ">=3.13"

dependencies = [
    # "genesis-world @ git+https://github.com/Genesis-Embodied-AI/Genesis.git",
    "torch",
    "tensorboard",
    "lerobot @ git+https://github.com/huggingface/lerobot.git@v0.2.0",
    "feetech-servo-sdk", # to control motors
    "gradio", # to build webapps
    # "nvidia-gr00t-sdk" @ git+https://github.com/NVIDIA/Isaac-GR00T.git
    "ipykernel", # to run notebooks
    "modal", # serverless GPU compute platform
    "pyscipopt", # SCIP solver
    "ultralytics", # YOLO models
    "rerun-sdk[datafusion]", # to store tele-operated episode data
    "gymnasium>=1.2.3",
    "opencv-python>=4.13.0.92",
    "huggingface-hub>=1.5.0,<2.0",
]

[project.scripts]
slobot-record = "slobot.hilserl.record:main"
slobot-learner = "slobot.hilserl.learner:train_cli"
slobot-actor = "slobot.hilserl.actor:actor_cli"
slobot-teleoperate = "slobot.hilserl.teleoperate:main"
slobot-calibrate = "slobot.hilserl.calibrate:main"
slobot-joint-control-real = "slobot.teleop.gradio_joint_control_real_app:main"
slobot-train = "slobot.hilserl.train:train_cli"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# MJCF & URDF configurations, 3d models
"slobot.config" = ["trs_so_arm100/*", "trs_so_arm100/assets/*", "SO100/*", "SO100/assets/*", "assets/*"]

[tool.pytest.ini_options]
pythonpath = ["src"]
